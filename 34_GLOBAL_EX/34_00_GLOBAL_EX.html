  <title>GLOBAL – Excavator Portfolio</title>
  <style>
    :root {
  --maroon: #C3231E;
  --black: #000000;
  --white: #ffffff;

  /* ===== "NEW" badge settings (change these to resize / retime) ===== */
  --new-badge-size: 70px;     /* width & height of new.jpg, e.g. 50px, 90px */
  --new-badge-gap: 12px;      /* space between the button and the badge */
  --new-badge-speed: 1s;      /* one flash cycle; smaller = faster */
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--white);
  color: var(--black);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
  padding: 40px 20px 100px;
}

h1 {
  color: var(--maroon);
  margin-bottom: 40px;
  font-size: 26px;
  text-align: center;
  font-weight: 700;
}

h2 {
  color: var(--black);
  text-align: center;
  width: 100%;
  margin-bottom: 20px;
}

.button-group {
  display: flex;
  flex-direction: column;   /* stack buttons vertically */
  align-items: center;      /* center horizontally */
  gap: 20px;                /* space between buttons */
  margin-top: 30px;
}

.button-group button {
  width: 350px;             /* same width for all */
  height: 70px;             /* same height */
  padding: 10px;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
  border-radius: 8px;
  border: 2px solid var(--black);
  cursor: pointer;
  background-color: var(--maroon);
  color: var(--white);
  transition: 0.2s ease;
}

.button-group button:hover {
  background-color: var(--black);
  color: var(--white);
}

.back-btn {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--black);
  color: var(--white);
  border: 2px solid var(--maroon);
  border-radius: 10px;
  padding: 10px 18px;
  font-weight: 700;
  cursor: pointer;
}

.back-btn:hover {
  background: var(--maroon);
  color: var(--white);
}

.modal {
  display: none;
  position: fixed;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: var(--white);
  padding: 20px;
  border-radius: 8px;
  width: 260px;
  text-align: center;
  color: var(--black);
  border: 2px solid var(--maroon);
}

.modal-buttons {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}

.modal-buttons button {
  width: 80px;
  padding: 6px 0;
  font-size: 13px;
  background: var(--maroon);
  color: var(--white);
  border: 1px solid var(--black);
  cursor: pointer;
}

.modal-buttons button:hover {
  background: var(--black);
}

/* ===== Flashing "NEW" badge beside a button ===== */
.btn-with-badge {
  position: relative;           /* badge is positioned against the button */
  display: inline-block;        /* keeps the button centred like the others */
}

.new-badge {
  position: absolute;
  top: 50%;
  left: calc(100% + var(--new-badge-gap));   /* just right of the button */
  width: var(--new-badge-size);
  height: var(--new-badge-size);
  object-fit: contain;
  transform: translateY(-50%);
  pointer-events: none;          /* clicks pass through, never block the button */
  animation: newFlash var(--new-badge-speed) ease-in-out infinite;
}

@keyframes newFlash {
  0%, 100% { opacity: 1;   transform: translateY(-50%) scale(1); }
  50%      { opacity: 0.2; transform: translateY(-50%) scale(0.9); }
}

@media (prefers-reduced-motion: reduce) {
  .new-badge { animation: none; }
}

/* small screens: badge sits on the button's top-right corner instead */
@media (max-width: 560px) {
  .new-badge {
    top: 0;
    left: auto;
    right: 0;
    width: calc(var(--new-badge-size) * 0.7);
    height: calc(var(--new-badge-size) * 0.7);
    transform: translate(35%, -35%);
  }
  @keyframes newFlash {
    0%, 100% { opacity: 1;   transform: translate(35%, -35%) scale(1); }
    50%      { opacity: 0.2; transform: translate(35%, -35%) scale(0.9); }
  }
}

@media (max-width: 900px) {
  .button-group {
    flex-direction: column;
    align-items: center;
  }
}
  </style>

const btnSubmit1 = document.getElementById("passwordSubmit1");

btnSupplier.addEventListener("click", () => {
  modal1.style.display = "flex";
  input1.value = "";

  input1.value = "";
});

  if (e.target === modal1) {
    modal1.style.display = "none";
    input1.value = "";
  }
});
